name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  regressions:
    # Same-repository commits run on push; fork commits run on pull_request.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    name: Native regression tests (ASan + UBSan)
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - name: Record the native toolchain image
        run: echo "RR_IMAGE_VERSION=$ImageOS-$ImageVersion" >> "$GITHUB_ENV"

      - name: Cache native shader tools
        id: native-tools-cache
        uses: actions/cache@v6
        with:
          path: |
            build/regression/_deps
            build/regression/legacy-shader-libs
          key: native-shader-tools-${{ runner.os }}-${{ runner.arch }}-${{ env.RR_IMAGE_VERSION }}-${{ hashFiles('src/hardware/r_d3d12/custom_shaders.cmake', 'tests/CMakeLists.txt', '.github/workflows/tests.yml') }}

      - name: Configure
        run: >-
          cmake -S tests -B build/regression
          -DCMAKE_CXX_COMPILER=clang++
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DRR_SANITIZERS=ON
          -DFETCHCONTENT_FULLY_DISCONNECTED=${{ steps.native-tools-cache.outputs.cache-hit == 'true' && 'ON' || 'OFF' }}

      - name: Build tests
        run: cmake --build build/regression --parallel 4

      - name: Run tests
        run: ctest --test-dir build/regression --output-on-failure --output-junit results.xml

      - name: Cache ZDBSP
        id: zdbsp-cache
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/zdbsp-build/zdbsp
          key: zdbsp-5d4fb9c-${{ runner.os }}-${{ runner.arch }}-${{ env.RR_IMAGE_VERSION }}-${{ hashFiles('.github/workflows/tests.yml') }}

      - name: Build ZDBSP for the renderer test map
        if: steps.zdbsp-cache.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/ZDoom/zdbsp "$RUNNER_TEMP/zdbsp"
          git -C "$RUNNER_TEMP/zdbsp" checkout 5d4fb9c
          cmake -S "$RUNNER_TEMP/zdbsp" -B "$RUNNER_TEMP/zdbsp-build" \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          cmake --build "$RUNNER_TEMP/zdbsp-build" --parallel 4

      - name: Check the renderer test map add-on
        run: python3 tests/addons/renderer-test/build.py --check --zdbsp "$RUNNER_TEMP/zdbsp-build/zdbsp"

      - name: Upload installable shader test
        uses: actions/upload-artifact@v7
        with:
          name: shader-smoke-test
          path: |
            tests/addons/shader-smoke/D_ShaderSmoke_v1.pk3
            tests/addons/shader-smoke/README.md
          if-no-files-found: error

      - name: Upload installable renderer test map
        uses: actions/upload-artifact@v7
        with:
          name: renderer-test-map
          path: |
            tests/addons/renderer-test/D_RenderTest_v1.pk3
            tests/addons/renderer-test/README.md
            tests/addons/renderer-test/models
          if-no-files-found: error

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: regression-results
          path: |
            build/regression/translated-shaders/*.hlsl
            build/regression/results.xml
            build/regression/Testing/Temporary/LastTest.log
            build/regression/Testing/Temporary/LastTestsFailed.log
          if-no-files-found: warn

  warp:
    # Same-repository commits run on push; fork commits run on pull_request.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    name: Direct3D 12 driver on WARP (debug layer + GPU-based validation)
    needs: regressions
    runs-on: windows-2022
    # The job takes about three minutes; a WARP or GPU hang shouldn't hold a runner for an hour.
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - name: Set up x64 MSVC environment
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -ne 0 -or !$vs) { throw "Visual Studio C++ tools were not found" }
          $before = [Environment]::GetEnvironmentVariables('Process')
          & "$vs\Common7\Tools\Launch-VsDevShell.ps1" -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
          Get-Command cl.exe, fxc.exe -ErrorAction Stop | Select-Object Name, Source
          # The image fixes the compiler, CMake and Ninja the translator cache was built with.
          "RR_IMAGE_VERSION=$env:ImageOS-$env:ImageVersion" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          # Each step starts a new shell; preserve the developer environment.
          foreach ($entry in [Environment]::GetEnvironmentVariables('Process').GetEnumerator()) {
            if ($before[$entry.Key] -cne $entry.Value) {
              "$($entry.Key)=$($entry.Value)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            }
          }

      - uses: actions/download-artifact@v8
        with:
          name: regression-results
          path: regression-results

      - name: Compile translated add-on shader fixtures
        shell: pwsh
        run: |
          $fxc = (Get-Command fxc -ErrorAction Stop).Source
          $fixtures = @(Get-ChildItem regression-results -Recurse -Filter *.hlsl | Where-Object { $_.Directory.Name -eq 'translated-shaders' })
          if ($fixtures.Count -ne 98) { throw "Expected 98 SM5.1 translated shader stages; found $($fixtures.Count)" }
          foreach ($fixture in $fixtures) {
            $profile = if ($fixture.Name.EndsWith('.vert.hlsl')) { 'vs_5_1' } else { 'ps_5_1' }
            & $fxc /nologo /O3 /T $profile /E main /Fo "$env:TEMP/rr-shader-test.cso" $fixture.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      # glslang and SPIRV-Cross take about a minute to build and only change with their pins, the translator's build
      # files or the runner image; the translator itself is rebuilt by Ninja when its source is newer.
      - name: Cache the shader translator build
        id: translator-cache
        uses: actions/cache@v6
        with:
          path: build/d3d12-regressions/legacy-build
          key: d3d12-translator-${{ env.RR_IMAGE_VERSION }}-${{ hashFiles('src/hardware/r_d3d12/custom_shaders.cmake', 'tests/d3d12-translator/CMakeLists.txt') }}

      - name: Direct3D 12 renderer regressions
        shell: pwsh
        env:
          RR_TRANSLATOR_CACHE_HIT: ${{ steps.translator-cache.outputs.cache-hit }}
        run: ./tests/run-d3d12.ps1

  linux:
    # Same-repository commits run on push; fork commits run on pull_request.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    name: Linux build (no Direct3D 12)
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build libsdl2-dev libpng-dev libcurl4-openssl-dev libopus-dev zlib1g-dev

      - name: Configure
        run: >-
          cmake --preset ninja-release
          -DSRB2_CONFIG_ENABLE_WEBM_MOVIES=OFF
          -DSRB2_CONFIG_ENABLE_DISCORDRPC=OFF
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Check that the Direct3D 12 driver is left out
        run: |
          if grep -q HAVE_D3D12 build/ninja-release/compile_commands.json; then
            echo "A Linux build must not include the Direct3D 12 driver"; exit 1
          fi

      - name: Check that the hardware renderer compiles with HAVE_D3D12 but not _UWP
        run: python3 tests/check-d3d12-desktop.py build/ninja-release/compile_commands.json

      - name: Build
        run: cmake --build build/ninja-release --parallel 4

  macos:
    # Same-repository commits run on push; fork commits run on pull_request.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    name: macOS build (no Direct3D 12)
    runs-on: macos-15
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: brew install ninja sdl2 libpng opus pkgconf

      - name: Configure
        run: >-
          cmake --preset ninja-release
          -DSRB2_CONFIG_ENABLE_WEBM_MOVIES=OFF
          -DSRB2_CONFIG_ENABLE_DISCORDRPC=OFF
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Check that the Direct3D 12 driver is left out
        run: |
          if grep -q HAVE_D3D12 build/ninja-release/compile_commands.json; then
            echo "A macOS build must not include the Direct3D 12 driver"; exit 1
          fi

      - name: Build
        run: cmake --build build/ninja-release --parallel 4
