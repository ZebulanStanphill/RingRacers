name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  regressions:
    # Same-repository commits run on push; fork commits run on pull_request.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    name: Native regression tests (ASan + UBSan)
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - name: Record the native toolchain image
        run: echo "RR_IMAGE_VERSION=$ImageOS-$ImageVersion" >> "$GITHUB_ENV"

      - name: Cache native shader tools
        id: native-tools-cache
        uses: actions/cache@v6
        with:
          path: |
            build/regression/_deps
            build/regression/legacy-shader-libs
          key: native-shader-tools-${{ runner.os }}-${{ runner.arch }}-${{ env.RR_IMAGE_VERSION }}-${{ hashFiles('src/hardware/r_d3d12/custom_shaders.cmake', 'tests/CMakeLists.txt', '.github/workflows/tests.yml') }}

      - name: Configure
        run: >-
          cmake -S tests -B build/regression
          -DCMAKE_CXX_COMPILER=clang++
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DRR_SANITIZERS=ON
          -DFETCHCONTENT_FULLY_DISCONNECTED=${{ steps.native-tools-cache.outputs.cache-hit == 'true' && 'ON' || 'OFF' }}

      - name: Build tests
        run: cmake --build build/regression --parallel 4

      - name: Run tests
        run: ctest --test-dir build/regression --output-on-failure --output-junit results.xml

      - name: Cache ZDBSP
        id: zdbsp-cache
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/zdbsp-build/zdbsp
          key: zdbsp-5d4fb9c-${{ runner.os }}-${{ runner.arch }}-${{ env.RR_IMAGE_VERSION }}-${{ hashFiles('.github/workflows/tests.yml') }}

      - name: Build ZDBSP for the renderer test map
        if: steps.zdbsp-cache.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/ZDoom/zdbsp "$RUNNER_TEMP/zdbsp"
          git -C "$RUNNER_TEMP/zdbsp" checkout 5d4fb9c
          cmake -S "$RUNNER_TEMP/zdbsp" -B "$RUNNER_TEMP/zdbsp-build" \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          cmake --build "$RUNNER_TEMP/zdbsp-build" --parallel 4

      - name: Check the renderer test map add-on
        run: python3 tests/addons/renderer-test/build.py --check --zdbsp "$RUNNER_TEMP/zdbsp-build/zdbsp"

      - name: Upload installable shader test
        uses: actions/upload-artifact@v7
        with:
          name: shader-smoke-test
          path: |
            tests/addons/shader-smoke/D_ShaderSmoke_v1.pk3
            tests/addons/shader-smoke/README.md
          if-no-files-found: error

      - name: Upload installable renderer test map
        uses: actions/upload-artifact@v7
        with:
          name: renderer-test-map
          path: |
            tests/addons/renderer-test/D_RenderTest_v1.pk3
            tests/addons/renderer-test/README.md
            tests/addons/renderer-test/models
          if-no-files-found: error

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: regression-results
          path: |
            build/regression/translated-shaders/*.hlsl
            build/regression/results.xml
            build/regression/Testing/Temporary/LastTest.log
            build/regression/Testing/Temporary/LastTestsFailed.log
          if-no-files-found: warn

  warp:
    # Same-repository commits run on push; fork commits run on pull_request.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    name: Direct3D 12 driver on WARP (debug layer + GPU-based validation)
    needs: regressions
    runs-on: windows-2022
    # The job takes about three minutes; a WARP or GPU hang shouldn't hold a runner for an hour.
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - name: Set up x64 MSVC environment
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -ne 0 -or !$vs) { throw "Visual Studio C++ tools were not found" }
          $before = [Environment]::GetEnvironmentVariables('Process')
          & "$vs\Common7\Tools\Launch-VsDevShell.ps1" -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
          Get-Command cl.exe, fxc.exe -ErrorAction Stop | Select-Object Name, Source
          # The image fixes the compiler, CMake and Ninja the translator cache was built with.
          "RR_IMAGE_VERSION=$env:ImageOS-$env:ImageVersion" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          # Each step starts a new shell; preserve the developer environment.
          foreach ($entry in [Environment]::GetEnvironmentVariables('Process').GetEnumerator()) {
            if ($before[$entry.Key] -cne $entry.Value) {
              "$($entry.Key)=$($entry.Value)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            }
          }

      - uses: actions/download-artifact@v8
        with:
          name: regression-results
          path: regression-results

      - name: Compile translated add-on shader fixtures
        shell: pwsh
        run: |
          $fxc = (Get-Command fxc -ErrorAction Stop).Source
          $fixtures = @(Get-ChildItem regression-results -Recurse -Filter *.hlsl | Where-Object { $_.Directory.Name -eq 'translated-shaders' })
          if ($fixtures.Count -ne 98) { throw "Expected 98 SM5.1 translated shader stages; found $($fixtures.Count)" }
          foreach ($fixture in $fixtures) {
            $profile = if ($fixture.Name.EndsWith('.vert.hlsl')) { 'vs_5_1' } else { 'ps_5_1' }
            & $fxc /nologo /O3 /T $profile /E main /Fo "$env:TEMP/rr-shader-test.cso" $fixture.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      # glslang and SPIRV-Cross take about a minute to build and only change with their pins, the translator's build
      # files or the runner image; the translator itself is rebuilt by Ninja when its source is newer.
      - name: Cache the shader translator build
        id: translator-cache
        uses: actions/cache@v6
        with:
          path: build/d3d12-regressions/legacy-build
          key: viberant-translator-${{ env.RR_IMAGE_VERSION }}-${{ hashFiles('src/hardware/r_d3d12/custom_shaders.cmake', 'tests/viberant-translator/CMakeLists.txt') }}

      - name: Direct3D 12 renderer regressions
        shell: pwsh
        env:
          RR_TRANSLATOR_CACHE_HIT: ${{ steps.translator-cache.outputs.cache-hit }}
        run: ./tests/run-d3d12.ps1

  vulkan:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    name: Vulkan driver on lavapipe (validation)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake g++ mesa-vulkan-drivers vulkan-validationlayers libvulkan1
      - name: Vulkan renderer regressions
        run: |
          # Lavapipe is the only device, so a missing one fails the run instead of falling back to another.
          icd=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -n 1)
          echo "Vulkan ICD: $icd"
          export VK_DRIVER_FILES="$icd"
          tests/run-vulkan.sh

  metal:
    # Same-repository commits run on push; fork commits run on pull_request.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    name: Metal driver on macOS (API and shader validation)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Record the runner image
        run: echo "RR_IMAGE_VERSION=$ImageOS-$ImageVersion" >> "$GITHUB_ENV"

      # glslang and SPIRV-Cross take minutes to build and only change with their pins, the harness's build file or the
      # runner image; the driver, mtl12, and the test are rebuilt by make when their sources are newer.
      - name: Cache the shader tools' build
        id: metal-tools-cache
        uses: actions/cache@v6
        with:
          path: |
            build/metal-tests/_deps
            build/metal-tests/legacy-shader-libs
            build/metal-tests/build-tools
          key: metal-shader-tools-${{ runner.os }}-${{ runner.arch }}-${{ env.RR_IMAGE_VERSION }}-${{ hashFiles('src/hardware/r_d3d12/custom_shaders.cmake', 'tests/metal-driver/CMakeLists.txt') }}

      # The script turns on Metal's API validation and shader validation, and the test fails without them. The runner's
      # GPU is the device: Metal has no CPU implementation.
      - name: Metal renderer regressions
        env:
          RR_METAL_CMAKE_ARGS: -DFETCHCONTENT_FULLY_DISCONNECTED=${{ steps.metal-tools-cache.outputs.cache-hit == 'true' && 'ON' || 'OFF' }}
        run: tests/run-metal.sh

  linux:
    # Same-repository commits run on push; fork commits run on pull_request.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    name: Linux build (VibeRant Vulkan)
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build libsdl2-dev libpng-dev libcurl4-openssl-dev libopus-dev zlib1g-dev

      - name: Configure
        run: >-
          cmake --preset ninja-release
          -DSRB2_CONFIG_ENABLE_WEBM_MOVIES=OFF
          -DSRB2_CONFIG_ENABLE_DISCORDRPC=OFF
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      # A Linux build has the VibeRant driver with its Vulkan backend by default, and never Direct3D 12 itself. Building it
      # is also the check that the hardware renderer's engine code compiles with HAVE_VIBERANT but not _UWP, off Windows.
      - name: Check that the driver is built with the Vulkan backend only
        run: |
          commands=build/ninja-release/compile_commands.json
          if ! grep -q -e '-DHAVE_VIBERANT ' -e '-DHAVE_VIBERANT"' $commands || ! grep -q HAVE_VIBERANT_VULKAN $commands; then
            echo "A Linux build must include the VibeRant driver (HAVE_VIBERANT) with its Vulkan backend (HAVE_VIBERANT_VULKAN) by default"; exit 1
          fi
          if grep -q HAVE_VIBERANT_D3D $commands; then
            echo "A Linux build must not include the Direct3D 12 backend"; exit 1
          fi

      - name: Build
        run: cmake --build build/ninja-release --parallel 4

  macos:
    # Same-repository commits run on push; fork commits run on pull_request.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    name: macOS build (VibeRant Metal)
    runs-on: macos-15
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: brew install ninja sdl2 libpng opus pkgconf

      - name: Configure
        run: >-
          cmake --preset ninja-release
          -DSRB2_CONFIG_ENABLE_WEBM_MOVIES=OFF
          -DSRB2_CONFIG_ENABLE_DISCORDRPC=OFF
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      # A macOS build has the VibeRant driver with its Metal backend by default, and no other backend: not Direct3D 12,
      # and not Vulkan (through MoltenVK).
      - name: Check that the driver is built with the Metal backend only
        run: |
          commands=build/ninja-release/compile_commands.json
          if ! grep -q -e '-DHAVE_VIBERANT ' -e '-DHAVE_VIBERANT"' $commands || ! grep -q HAVE_VIBERANT_METAL $commands; then
            echo "A macOS build must include the VibeRant driver (HAVE_VIBERANT) with its Metal backend (HAVE_VIBERANT_METAL) by default"; exit 1
          fi
          if grep -q -e HAVE_VIBERANT_D3D -e HAVE_VIBERANT_VULKAN $commands; then
            echo "A macOS build must not include the Direct3D 12 or the Vulkan backend"; exit 1
          fi
          # The backend's Objective-C++ files rely on automatic reference counting to keep Metal's objects alive
          python3 - $commands <<'PY'
          import json, sys
          files = {"mtl12_device.mm", "mtl12_commands.mm", "mtl12_resources.mm", "mtl12_pipeline.mm", "mtl_present.mm"}
          seen = set()
          for entry in json.load(open(sys.argv[1])):
              name = entry["file"].rsplit("/", 1)[-1]
              if name in files:
                  seen.add(name)
                  if "-fobjc-arc" not in entry.get("command", " ".join(entry.get("arguments", []))):
                      sys.exit(name + " must be compiled with -fobjc-arc")
          if seen != files:
              sys.exit("A macOS build must compile the Metal backend and its presenter; missing: " + ", ".join(sorted(files - seen)))
          PY

      - name: Build
        run: cmake --build build/ninja-release --parallel 4

      # The app as the build leaves it, for Apple silicon: it isn't signed, and it loads Homebrew's SDL2, libpng, and
      # Opus (brew install sdl2 libpng opus) rather than carrying them. It looks for the game's data (bios.pk3, data/,
      # models/) in the directory it is started from. An archive, because an artifact doesn't keep the executable bit.
      - name: Pack the app
        run: tar -C build/ninja-release/bin -czf macos-app.tar.gz .

      - name: Upload macOS build
        uses: actions/upload-artifact@v7
        with:
          name: macos-app
          path: macos-app.tar.gz
          if-no-files-found: error

  windows:
    # Same-repository commits run on push; fork commits run on pull_request.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    name: Windows desktop build (OpenGL and Direct3D 12)
    runs-on: windows-2022
    # A cold vcpkg cache builds SDL2, libvpx, curl and the rest of vcpkg.json's dependencies from source.
    timeout-minutes: 60

    env:
      VCPKG_ROOT: ${{ github.workspace }}\vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg-cache

    steps:
      - uses: actions/checkout@v7

      # As in the warp job, plus Visual Studio's bundled clang-cl, which the developer shell doesn't always put on PATH.
      - name: Set up x64 MSVC environment and clang-cl
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -ne 0 -or !$vs) { throw "Visual Studio C++ tools were not found" }
          $before = [Environment]::GetEnvironmentVariables('Process')
          & "$vs\Common7\Tools\Launch-VsDevShell.ps1" -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
          $vsLlvm = Join-Path $env:VCINSTALLDIR "Tools\Llvm\x64\bin"
          if (-not (Get-Command clang-cl -ErrorAction SilentlyContinue) -and (Test-Path (Join-Path $vsLlvm "clang-cl.exe"))) {
            $env:PATH = "$vsLlvm;$env:PATH"
          }
          # fxc compiles the Direct3D 12 driver's shaders: the developer shell has it on PATH, and CMake also looks in
          # WindowsSdkVerBinPath
          Get-Command cl.exe, clang-cl.exe, cmake.exe, ninja.exe, fxc.exe -ErrorAction Stop | Select-Object Name, Source
          "WindowsSdkVerBinPath=$env:WindowsSdkVerBinPath"
          clang-cl --version
          "RR_IMAGE_VERSION=$env:ImageOS-$env:ImageVersion" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          # Each step starts a new shell; preserve the developer environment, except VCPKG_ROOT, which the developer
          # shell points at Visual Studio's bundled vcpkg: this job uses its own full clone.
          foreach ($entry in [Environment]::GetEnvironmentVariables('Process').GetEnumerator()) {
            if ($entry.Key -ne 'VCPKG_ROOT' -and $before[$entry.Key] -cne $entry.Value) {
              "$($entry.Key)=$($entry.Value)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            }
          }

      # Full clone: vcpkg.json pins a builtin-baseline commit.
      - name: Set up vcpkg
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg.git $env:VCPKG_ROOT
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat" -disableMetrics
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null

      - name: Cache vcpkg binaries
        uses: actions/cache@v6
        with:
          path: vcpkg-cache
          key: vcpkg-${{ runner.os }}-${{ env.RR_IMAGE_VERSION }}-x64-windows-static-md-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'thirdparty/overlay-ports/**') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ env.RR_IMAGE_VERSION }}-x64-windows-static-md-
            vcpkg-${{ runner.os }}-

      # MSVC-compatible desktop builds have the Direct3D 12 driver by default (SRB2_CONFIG_VIBERANT_D3D), beside OpenGL: the
      # Renderer setting picks one, and it presents on a child window of the SDL window.
      - name: Configure
        shell: pwsh
        run: >-
          cmake --preset ninja-x64_windows_vcpkg-release
          -DSRB2_CONFIG_ENABLE_WEBM_MOVIES=OFF
          -DSRB2_CONFIG_ENABLE_DISCORDRPC=OFF
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      # Its presenter is the desktop one, not UWP's
      - name: Check that the Direct3D 12 driver is included
        shell: pwsh
        run: |
          $commands = "build/ninja-x64_windows_vcpkg-release/compile_commands.json"
          if (-not (Select-String -Path $commands -Pattern HAVE_VIBERANT -Quiet -ErrorAction Stop)) {
            Write-Error "A Windows desktop build made with clang-cl must define HAVE_VIBERANT by default"; exit 1
          }
          if (-not (Select-String -Path $commands -Pattern 'd3d12_present_win32\.cpp' -Quiet -ErrorAction Stop)) {
            Write-Error "The desktop build must compile d3d12_present_win32.cpp"; exit 1
          }
          if (Select-String -Path $commands -Pattern 'd3d12_present\.cpp' -Quiet -ErrorAction Stop) {
            Write-Error "The desktop build must not compile the UWP presenter, d3d12_present.cpp"; exit 1
          }

      - name: Build
        shell: pwsh
        run: cmake --build --preset ninja-x64_windows_vcpkg-release --parallel 4

      # The executable is named after the git branch unless it is master (CMakeLists.txt); the build copies the DLLs it
      # needs next to it. It offers Software, VibeRant D3D and Legacy GL.
      - name: Upload Windows desktop build
        uses: actions/upload-artifact@v7
        with:
          name: windows-desktop
          path: |
            build/ninja-x64_windows_vcpkg-release/bin/*.exe
            build/ninja-x64_windows_vcpkg-release/bin/*.dll
          if-no-files-found: error
